# Checks da PR: segredo e o crivo das skills, e um fan-in. O ruleset de `main`
# exige `gitleaks`, `all_checks_passed` e o `check_pr_title` do `pr-title.yml`.
#
# Este repositorio e publico e nao consegue chamar reusable de repositorio
# privado: `uses: aegro/infra-github-actions/...` falha antes de rodar. Por isso
# `gitleaks` espelha, aqui dentro, o `scan_secrets-git.yml` de la — mudou la,
# mude aqui.
#
# Sem merge queue. Se ligarem, acrescente `merge_group` aqui e no `pr-title.yml`
# (que ja sai verde nesse evento), senao os checks obrigatorios nunca reportam
# na fila.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push em `main` nao entra na fila: cada merge tem o crivo do proprio commit.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Historico inteiro alcancavel pelo HEAD — o reusable da org, com checkout
  # raso, so ve a arvore atual. O repo e publico: segredo que entrou e saiu num
  # commit antigo continua exposto. So o HEAD, nao `--all`: segredo em outro
  # branch nao pode travar PR alheia.
  # `-m`: sem ele o `git log -p` nao mostra o diff de merge commit, e segredo
  # introduzido num merge passa batido.
  # `--redact` porque o log do Actions de repo publico e aberto.
  # Falso positivo: fingerprint no `.gitleaksignore`.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # O gitleaks le `.gitleaks.toml` e `.gitleaksignore` da propria arvore
      # escaneada: a PR pode calar o proprio vazamento. Nao da para reprovar
      # (ninguem tem bypass e o fingerprint legitimo tambem passa por aqui),
      # entao o aviso vai para quem revisa.
      - name: Avisar se a PR mexe na configuracao do gitleaks
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          arquivos="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          for f in .gitleaks.toml .gitleaksignore; do
            if printf '%s\n' "$arquivos" | grep -qxF "$f"; then
              echo "::warning file=$f::A PR altera $f, que muda o que o gitleaks reporta nesta mesma PR. Revise o arquivo antes de aprovar."
            fi
          done
      # Mesma imagem, pelo mesmo digest, que o reusable da org (gitleaks v8.18.0).
      - name: scan-secrets
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:e5f6d1a62786affd1abd882ecc73e9353ce78adea1650711f6e351767723712d
        run: |
          docker image pull "$GITLEAKS_IMAGE"
          docker run --rm -u "$(id -u)" -v "${GITHUB_WORKSPACE}:/path" "$GITLEAKS_IMAGE" \
            detect --source="/path" --log-opts="--full-history -m HEAD" --redact -v

  # Crivo mecanico das skills: so checagens que se resolvem lendo o repositorio.
  # O que depende da CLI publicada vai no drift agendado.
  # Por que: docs/decisions/0004-crivo-na-pr-drift-agendado.md
  #
  # Sem filtro de `paths` no gatilho: um check obrigatorio filtrado fica
  # "Expected" para sempre na PR que nao toca os caminhos, e trava o merge. A
  # decisao de pular mora no passo `escopo`, e o job sai verde.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Na PR o checkout e o merge commit: profundidade 2 traz os dois pais, e
      # HEAD^1 e a base atual — o diff e exatamente o que a PR muda.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Ha o que checar?
        id: escopo
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevante=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `--no-renames`: mover uma skill para fora de `skills/` tambem conta.
          # AGENTS.md entra porque "mudou uma regra aqui, mude la" — a PR que
          # muda so o padrao e justamente a que precisa do crivo. README.md entra
          # porque o crivo cobra que toda skill esteja listada nele.
          # O diff fora do grep: se ele falhar, o job tem que falhar, nao pular.
          arquivos="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          tocados="$(printf '%s\n' "$arquivos" \
            | grep -E '^(skills/|scripts/lint_skills\.py$|AGENTS\.md$|README\.md$|\.github/workflows/ci\.yml$)' || true)"
          if [ -n "$tocados" ]; then
            printf '%s\n' "$tocados"
            echo "relevante=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A PR nao toca skill, crivo, AGENTS.md nem README.md — crivo pulado."
            echo "relevante=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.escopo.outputs.relevante == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Crivo das skills
        if: steps.escopo.outputs.relevante == 'true'
        run: python scripts/lint_skills.py

  # `skipped` e `cancelled` reprovam: dependencia que nao rodou nao provou nada.
  # Job novo neste workflow precisa entrar no `needs`.
  # `always()` e nao `!cancelled()`: job pulado conta como aprovado no ruleset, e
  # um cancelamento manual liberaria o merge sem gitleaks. O custo e um FAILURE
  # deste job em todo run cancelado, que o run seguinte sobrescreve.
  all_checks_passed:
    name: all_checks_passed
    if: always() && github.event_name == 'pull_request'
    needs: [gitleaks, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Falha se alguma dependencia nao terminou em success
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          not_ok="$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"')"
          if [ -n "$not_ok" ]; then
            printf '%s\n' "$not_ok"
            echo "::error::uma dependencia nao terminou em success - veja os resultados acima"
            exit 1
          fi
