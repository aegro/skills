# Titulo da PR em Conventional Commits — check `check_pr_title`, exigido pelo
# ruleset de `main`.
#
# Espelha o `check_pr-title.yml` do `aegro/infra-github-actions`: este repo e
# publico e nao consegue chamar reusable de repositorio privado. Mudou la, mude
# aqui.
#
# Workflow separado do `ci.yml` para que `edited` (que dispara tambem quando so
# o corpo muda) nao reinicie o gitleaks e o crivo a cada edicao da descricao.
name: PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

# Duas edicoes seguidas no mesmo SHA: so o titulo mais novo pode dar o veredito.
concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check_pr_title:
    name: check_pr_title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Lista da org; `chore` fica de fora de proposito.
          TYPES: build|ci|docs|feat|fix|perf|refactor|revert|test
        run: |
          # `merge_group` nao traz PR no payload: o titulo ja foi validado na PR,
          # e o check obrigatorio precisa reportar na fila mesmo assim.
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "merge_group: no pull request in the payload; the title was validated on the PR."
            exit 0
          fi
          echo "PR title: $PR_TITLE"
          pattern="^(${TYPES})(\(.+\))?!?:[[:space:]].+"
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "❌ Invalid PR title format."
            echo "Expected format: type(optional-scope)[!]: description"
            echo "Allowed types: ${TYPES//|/, }"
            exit 1
          fi
